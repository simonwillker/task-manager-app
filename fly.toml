# fly.toml app configuration file generated for task-manager-app-g1vgmg on 2026-10-18T04:42:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'task-manager-app-g1vgmg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_BASE_URL = 'https://simonwillker-task-manager.fly.dev'
  CLIENT_IP_HEADER = 'fly-client-ip'
  MAIL_TRANSPORT = 'resend'
  NODE_ENV = 'production'
  SECURE_COOKIES = 'true'

[[mounts]]
  source = 'task_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
