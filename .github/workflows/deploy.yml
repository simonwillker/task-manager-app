name: CI / Deploy to Fly.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR では古い実行を中断する。main へのデプロイは中断しない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: E2E テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite を使うため Node.js 22.13 以上が必要
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium

      - name: テストを実行
        run: npm test

      - name: レポートを保存
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker イメージの起動確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: イメージをビルド
        run: docker build -t task-manager-app .

      - name: 本番設定で起動し、ヘルスチェックが通るか確認
        run: |
          docker run -d --name app -p 3000:3000 \
            -e APP_BASE_URL=https://example.com \
            -e SECURE_COOKIES=true \
            -e MAIL_TRANSPORT=resend \
            -e RESEND_API_KEY=re_dummy \
            task-manager-app
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              # root 以外のユーザーでもボリュームに DB を作成できていること
              docker exec app test -f /data/tasks.db
              echo "DB file created in /data"
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

  deploy:
    name: Fly.io へデプロイ
    # テストとイメージ確認が成功し、main へ push されたときだけデプロイする
    needs: [test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://simonwillker-task-manager.fly.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: デプロイ用トークンの確認
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning title=デプロイをスキップしました::リポジトリの Secrets に FLY_API_TOKEN がありません。README の「本番環境に公開する」の手順で設定してください。"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.available == 'true'

      - name: デプロイ
        if: steps.token.outputs.available == 'true'
        # SQLite はボリューム 1 つに置くため、マシンは 1 台だけにする
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
