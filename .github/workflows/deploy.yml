name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN に Pages へのデプロイ権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは中断せず、キューは最新の 1 件のみ残す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: E2E テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium

      - name: テストを実行
        run: npm test

      - name: レポートを保存
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: サイトをビルド
    # テスト成功時のみ、かつ main への push でのみデプロイする
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 公開ファイルを収集
        # 静的アプリのため、公開に必要なファイルのみを _site へ集める
        run: |
          mkdir -p _site
          cp index.html style.css script.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
