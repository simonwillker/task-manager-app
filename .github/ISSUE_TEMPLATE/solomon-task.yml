name: Solomon 任务
description: 把一项工作交给 Solomon，由 Claude 或 ChatGPT 执行
labels: ["solomon"]
body:
  - type: textarea
    id: task
    attributes:
      label: 任务描述
      description: 要做什么，越具体越好。
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 期望成果
      description: 例如「开一个 PR」「在 docs/ 写一份文档」。
  - type: dropdown
    id: model
    attributes:
      label: 执行模型
      description: 也可以之后用 model:claude / model:chatgpt 标签指定，标签优先。
      options:
        - Claude
        - ChatGPT
      default: 0
